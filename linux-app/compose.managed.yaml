# Use together with compose.yaml. The read-only host mounts remain mounted but
# managed mode exclusively uses /data/codex, never refreshes the host's auth.json.
services:
  aiclock:
    build:
      target: managed
      args:
        CODEX_VERSION: "${AICLOCK_CODEX_VERSION:-0.162.0}"
    image: aiclock-linux:managed
    environment:
      AICLOCK_CODEX_MODE: managed
      AICLOCK_CODEX_HOME: /data/codex
